<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLMS - Online Learning Management System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Header Branding -->
            <div class="brand-header" id="mainCardHeader">
                <div class="logo-badge">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <h1>OLMS Portal</h1>
                <p>Online Learning Management System</p>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-group" id="tabGroup">
                <button type="button" class="tab-btn active" id="loginTabBtn">Sign In</button>
                <button type="button" class="tab-btn" id="registerTabBtn">Register</button>
            </div>

            <!-- Alert Notification Banner -->
            <div class="alert" id="alertBox">
                <span id="alertMessage"></span>
            </div>

            <!-- Login Form Section -->
            <div class="form-section active" id="loginFormSection">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <button type="button" class="toggle-password" data-target="loginPassword" title="Toggle password visibility">
                                <svg viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="options-bar">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link" onclick="alert('Password reset link has been requested.'); return false;">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-primary" id="loginSubmitBtn">
                        <span class="btn-spinner" id="loginSpinner"></span>
                        <span class="btn-text">Sign In</span>
                    </button>
                </form>
            </div>

            <!-- Registration Form Section -->
            <div class="form-section" id="registerFormSection">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regFullName">Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="regFullName" class="form-control" placeholder="John Doe" required autocomplete="name">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required autocomplete="email">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="regPassword" class="form-control" placeholder="Create a strong password" required autocomplete="new-password">
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <button type="button" class="toggle-password" data-target="regPassword" title="Toggle password visibility">
                                <svg viewBox="0 0 24 24">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regRole">Select Role</label>
                        <div class="input-wrapper">
                            <select id="regRole" class="form-control">
                                <option value="LEARNER">Learner</option>
                                <option value="INSTRUCTOR">Instructor</option>
                                <option value="ADMIN">Administrator</option>
                            </select>
                            <svg class="input-icon" viewBox="0 0 24 24">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            <svg class="select-arrow" viewBox="0 0 24 24">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="registerSubmitBtn">
                        <span class="btn-spinner" id="registerSpinner"></span>
                        <span class="btn-text">Create Account</span>
                    </button>
                </form>
            </div>

            <!-- Logged In State View -->
            <div class="logged-in-view" id="loggedInView">
                <div class="user-avatar">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <h2>Welcome Back!</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;" id="loggedInUserEmail"></p>
                
                <div style="margin-top: 16px; text-align: left;">
                    <span style="font-size: 0.78rem; font-weight: 600; color: #94a3b8; text-transform: uppercase;">Active JWT Token</span>
                    <div class="token-box" id="tokenDisplay"></div>
                </div>

                <button type="button" class="btn-secondary" id="logoutBtn">Sign Out</button>
            </div>

            <!-- Card Footer -->
            <div class="card-footer">
                OLMS Backend API v0.0.1 &bull; Powered by Spring Boot 3
            </div>
        </div>
    </div>

    <!-- JavaScript App File -->
    <script src="js/app.js"></script>
</body>
</html>
